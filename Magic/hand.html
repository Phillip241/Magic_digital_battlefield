<!DOCTYPE html>
<html>
<head>
    <title>Meu site</title>
    <link rel="stylesheet" href="app.css">
</head>

<body>
<button  onclick="ativar()">
    Carta
</button>
</body>

<script>
function ativar() {
    let contador = Number(localStorage.getItem("contador")) || 0;

    contador++;

    localStorage.setItem("contador", contador);
}
</script>

</html>
